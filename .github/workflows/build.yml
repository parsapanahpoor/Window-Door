name: Build

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify source and build Release
        shell: pwsh
        run: ./scripts/dev.ps1 Verify

      - name: Check password recovery with an offline provider
        run: dotnet run --project tests/PasswordRecoveryChecks -c Release

      - name: Build seller dashboard checks and install Chromium
        shell: pwsh
        run: |
          dotnet build tests/SellerDashboardChecks -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File tests/SellerDashboardChecks/bin/Release/net8.0/playwright.ps1 install chromium --only-shell

      - name: Check seller dashboard and language in a browser
        run: dotnet run --no-build --project tests/SellerDashboardChecks -c Release
