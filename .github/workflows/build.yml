name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify source and build Release
        shell: pwsh
        run: ./scripts/dev.ps1 Verify

      - name: Check password recovery with an offline provider
        run: dotnet run --project tests/PasswordRecoveryChecks -c Release
